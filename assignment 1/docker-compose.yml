services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpassword
      POSTGRES_DB: tasks
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://taskuser:taskpassword@db:5432/tasks
    ports:
      - "3000:3000"
    

volumes:
  postgres_data: